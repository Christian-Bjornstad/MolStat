<!doctype html>
<html lang="nb">
  <head><meta charset="utf-8"><title>Synthetic LVMS batch</title></head>
  <body>
    <nav>
      <a id="section">Eksterne rapporter</a>
      <a id="defined_reports">Definerte rapporter</a>
    </nav>
    <select id="jobtypeselector" name="jobtypeselector"></select>
    <iframe id="_nav_frame1" name="_nav_frame1" title="Synthetic controls"></iframe>
    <template id="frame-controls">
      <button id="clear" name="menu" type="button">Clear</button>
      <label>Kategori <select id="category"></select></label>
      <label>Rapport id <select id="report-id"></select></label>
      <label>Notater <textarea id="notes"></textarea></label>
      <label>Angi analyse(r) <textarea id="analyses"></textarea></label>
      <label>Analyse opprettet fom: <input id="created-from" type="text"></label>
      <label>Analyse opprettet tom: <input id="created-to" type="text"></label>
      <button id="export" name="menu" type="button">Export</button>
    </template>
  </body>
</html>
