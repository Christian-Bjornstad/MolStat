[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molstat"
version = "0.1.0"
description = "Samlet statistikk- og driftsinnsikt for molekylærpatologi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7,<7",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
molstat = "molstat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyqt6"
